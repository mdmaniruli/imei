<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Camera IMEI Matcher</title>
<style>
body{margin:0;font-family:Arial,sans-serif;padding:10px;text-align:center}
input, button{width:100%;padding:12px;margin:5px 0;font-size:16px}
#camera-container{position:relative;width:100%;height:300px;background:#000}
#overlay{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
</style>
</head>
<body>
<input id="target" type="text" placeholder="Enter target IMEI">
<button id="startBtn">Start Camera Scan</button>
<div id="status"></div>
<div id="camera-container"></div>
<canvas id="overlay"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
<script>
const targetEl = document.getElementById('target');
const startBtn = document.getElementById('startBtn');
const cameraContainer = document.getElementById('camera-container');
const overlay = document.getElementById('overlay');
const statusEl = document.getElementById('status');
const overlayCtx = overlay.getContext('2d');

startBtn.addEventListener('click',()=>{
  const target = targetEl.value.trim();
  if(!target){statusEl.textContent='Enter target IMEI'; return;}

  Quagga.init({
    inputStream:{name:'Live',type:'LiveStream',target:cameraContainer,constraints:{facingMode:'environment'}},
    decoder:{readers:['code_128_reader','ean_reader','ean_8_reader','upc_reader','upc_e_reader','code_39_reader']},
    locate:true
  },err=>{
    if(err){statusEl.textContent='Camera error: '+err; return;}
    Quagga.start();
    statusEl.textContent='Scanning...';
    const video = cameraContainer.querySelector('video');
    video.addEventListener('loadedmetadata',()=>{
      overlay.width=video.videoWidth;
      overlay.height=video.videoHeight;
    });
  });

  Quagga.onProcessed(result=>{overlayCtx.clearRect(0,0,overlay.width,overlay.height);});

  Quagga.onDetected(data=>{
    const code=data.codeResult.code;
    if(code===target){
      const box=data.box;
      overlayCtx.clearRect(0,0,overlay.width,overlay.height);
      overlayCtx.strokeStyle='green';
      overlayCtx.lineWidth=4;
      overlayCtx.beginPath();
      overlayCtx.moveTo(box[0][0],box[0][1]);
      box.forEach(p=>overlayCtx.lineTo(p[0],p[1]));
      overlayCtx.closePath();
      overlayCtx.stroke();
      statusEl.textContent='MATCHED: '+code;
      // Optional beep: new Audio('https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg').play();
    }
  });
});
</script>
</body>
</html>
